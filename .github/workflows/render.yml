name: Render stickman fight
on:
  push:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Arrange files
        run: |
          mkdir -p src scripts public/sfx
          mv index.ts Root.tsx stickman.tsx choreo.ts Fight.tsx src/
          mv gen_audio.py scripts/
      - run: npm install
      - name: Generate SFX
        run: |
          pip install numpy
          npm run sfx
      - name: Chrome libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0
      - run: npx remotion browser ensure
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: stickman-fight
          path: out/stickman-fight.mp4
# selesai
